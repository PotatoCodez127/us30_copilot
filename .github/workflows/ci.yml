name: Quant Pipeline Core CI

# Trigger automated quality gates on branch code pushes or incoming pull requests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pipeline-validation:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down tracking branch codebase files
    - name: Checkout Codebase Source
      uses: actions/checkout@v4

    # 2. Provision an isolated Python 3.11 environment container matching Docker specs
    - name: Setup Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Leverages secure pip caching for accelerated runner optimization

    # 3. Pull down active quantitative packages followed by testing utilities
    - name: Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        python -m pip install --upgrade pathspec black ruff pytest

    # 4. Enforce visual PEP 8 format alignment criteria
    - name: Verify Layout Alignment (Black Check)
      run: python -m black --check .

    # 5. Conduct static compilation syntax checks and verify explicit first-party Isort blocks
    - name: Static Syntax Compilation Audit (Ruff Check)
      run: python -m ruff check .

    # 6. Execute the mathematical indicator test suite
    - name: Run Mathematical Unit Tests (Pytest Runner)
      run: python -m pytest