<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US30 Copilot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: white; }
        .text-success { color: #00e676 !important; }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">🚀 US30 Copilot AI Dashboard</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Latest Trial</h5>
                <h3 id="trial-number" class="text-info">Loading...</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Latest Score</h5>
                <h3 id="latest-score">Loading...</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Best Score</h5>
                <h3 id="best-score" class="text-success">Loading...</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Status</h5>
                <h3 id="trial-status">Loading...</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card p-3">
                <h5>Live Equity Curve</h5>
                <canvas id="equityChart" height="100"></canvas>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card p-3 h-100">
                <h5>🤖 AI Agent State</h5>
                <hr>
                <p><strong>Current State:</strong> <span class="badge bg-primary">MONITORING</span></p>
                <p><strong>Last Action:</strong> Evaluated M1 Pivots</p>
                <p><strong>Confidence:</strong> 82%</p>
                <button class="btn btn-outline-light btn-sm mt-auto">Refresh Agent Log</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Fetch Metrics
    fetch('/api/metrics')
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('trial-number').innerText = `#${data.trial_number}`;
                document.getElementById('latest-score').innerText = data.latest_score.toFixed(2);
                document.getElementById('best-score').innerText = data.best_score.toFixed(2);
                document.getElementById('trial-status').innerText = data.trial_status;
            } else {
                console.error("Error loading metrics:", data.message);
            }
        });

    // Fetch and Draw Equity Chart
    fetch('/api/equity')
        .then(response => response.json())
        .then(data => {
            const ctx = document.getElementById('equityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Account Equity ($)',
                        data: data.equity,
                        borderColor: '#00e676',
                        backgroundColor: 'rgba(0, 230, 118, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { grid: { color: '#333' } },
                        x: { grid: { color: '#333' } }
                    }
                }
            });
        });
</script>

</body>
</html>
