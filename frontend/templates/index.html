<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US30 Copilot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: white; }
        .text-success { color: #00e676 !important; }
        .text-danger { color: #ff5252 !important; }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">🚀 US30 Copilot Live Monitor</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Latest Net Profit</h5>
                <h3 id="net-profit">Loading...</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Win Rate</h5>
                <h3 id="win-rate">Loading...</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Profit Factor</h5>
                <h3 id="profit-factor">Loading...</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h5>Total Trades</h5>
                <h3 id="total-trades">Loading...</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card p-3">
                <h5>Latest Trial Equity Curve</h5>
                <canvas id="equityChart" height="100"></canvas>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card p-3 h-100">
                <h5>🤖 Autoresearch Status</h5>
                <hr>
                <p><strong>Current Trial:</strong> <span id="trial-number" class="badge bg-primary">Loading...</span></p>
                <p><strong>Status:</strong> <span id="trial-status">Loading...</span></p>
                <p class="text-muted mt-3" style="font-size: 0.8em;">Monitoring batch_results folder...</p>
            </div>
        </div>
    </div>
</div>

<script>
let equityChartInstance = null;

    function updateDashboard() {
        // Fetch Metrics
        fetch('/api/metrics')
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    const profitEl = document.getElementById('net-profit');
                    profitEl.innerText = `$${data.net_profit.toFixed(2)}`;
                    profitEl.className = data.net_profit >= 0 ? "text-success" : "text-danger";

                    document.getElementById('win-rate').innerText = `${data.win_rate.toFixed(1)}%`;
                    document.getElementById('profit-factor').innerText = data.profit_factor.toFixed(2);
                    document.getElementById('total-trades').innerText = data.total_trades;
                    document.getElementById('trial-number').innerText = `#${data.trial}`;
                    document.getElementById('trial-status').innerText = data.status_msg;
                } else {
                    // Show the actual error message!
                    document.getElementById('trial-status').innerText = "ERROR: " + data.message;
                    document.getElementById('trial-status').className = "text-danger";
                }
            })
            .catch(err => console.error("Metrics Error:", err));

        // Fetch Chart Data
        fetch('/api/equity')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('equityChart').getContext('2d');
                
                if (equityChartInstance) {
                    equityChartInstance.destroy();
                }

                const finalEquity = data.equity[data.equity.length - 1];
                const lineColor = finalEquity >= 10000 ? '#00e676' : '#ff5252';
                const bgColor = finalEquity >= 10000 ? 'rgba(0, 230, 118, 0.1)' : 'rgba(255, 82, 82, 0.1)';

                equityChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Account Equity ($)',
                            data: data.equity,
                            borderColor: lineColor,
                            backgroundColor: bgColor,
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1,
                            pointRadius: 4 // Made dots visible since there are only 2 points (Start/End)
                        }]
                    },
                    options: {
                        responsive: true,
                        animation: false,
                        scales: {
                            y: { grid: { color: '#333' } },
                            x: { grid: { color: '#333' } } 
                        }
                    }
                });
            })
            .catch(err => console.error("Chart Error:", err));
    }

    updateDashboard();
    setInterval(updateDashboard, 3000);
</script>

</body>
</html>
